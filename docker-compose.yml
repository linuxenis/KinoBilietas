# Paleidimas viena komanda: docker compose up --build (NFR-08)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kinobilietas_db}
      POSTGRES_USER: ${POSTGRES_USER:-kinobilietas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinobilietas}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kinobilietas} -d ${POSTGRES_DB:-kinobilietas_db}"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-kinobilietas_db}
      POSTGRES_USER: ${POSTGRES_USER:-kinobilietas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kinobilietas}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-tik-demonstracijai-pakeisti-i-atsitiktini-rakta}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin2026}
      DEMO_KLIENTO_SLAPTAZODIS: ${DEMO_KLIENTO_SLAPTAZODIS:-Kinas2026}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
    depends_on:
      - api

volumes:
  pgdata:
  media:
  static:
